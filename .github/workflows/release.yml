name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Restore tracked module sources
        run: |
          git restore --worktree -- modules themes
          composer dump-autoload --no-interaction --no-scripts --optimize

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit dependencies
        run: composer audit --locked

      # A release is a claim that this tree is the one the fleet resolves to. Both halves
      # of that claim are checked here rather than assumed from a green Tests run on main:
      # the packages must match their published releases, and the suite must pass against
      # exactly those files.
      - name: Installed packages match the tracked source
        run: git diff --exit-code --stat -- modules themes

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run release verification
        run: scripts/verify-automation-release

      - name: Validate documentation
        run: php scripts/validate-documentation.php

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving the published release unchanged."
          else
            gh release create "$TAG" --generate-notes --verify-tag
          fi
