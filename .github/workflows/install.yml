name: Install

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo, pdo_sqlite, sqlite3, mysql, dom, curl, intl, gd

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 'latest'
          cache: 'npm'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Restore tracked module sources
        run: |
          # Composer's Liberu installer writes published package archives into
          # modules/ and themes/. This application keeps the checked-out package
          # sources there as well, so restore them before Laravel boots and runs
          # package discovery.
          git restore --worktree -- modules themes
          composer dump-autoload --no-interaction --no-scripts --optimize

      # §6.2: modules/ and themes/ are checked-out package sources that Composer
      # temporarily overlays during installation. They must be clean before the
      # application boots, so package discovery always uses the committed sources.
      - name: Installed packages match the tracked source
        run: |
          if ! git diff --exit-code --stat -- modules themes; then
            echo "::error::A clean install rewrote tracked files under modules/ or themes/."
            echo "Edit the package repository and release it; do not edit installed files here."
            exit 1
          fi

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run database migrations (SQLite)
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build
