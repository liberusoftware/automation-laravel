name: Tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite, bcmath, opcache, zip, gd, intl, dom, curl
          coverage: xdebug

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Restore tracked module sources
        run: |
          git restore --worktree -- modules themes
          composer dump-autoload --no-interaction --no-scripts --optimize

      - name: Audit dependencies
        run: composer audit --locked

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: vendor/bin/pint --test

      # phpstan.neon existed and was configured at level 9 while nothing ever
      # ran it. Scope and level are explained in that file.
      - name: Static analysis
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Validate Automation OpenAPI contracts
        run: php scripts/validate-automation-openapi.php

      - name: Validate documentation
        run: php scripts/validate-documentation.php

      - name: Test Automation packages
        run: scripts/test-automation-packages

      # The threshold measures app/ alone — the host's five composition classes. Package
      # coverage is each package's own gate, against its own phpunit.xml (§3.10).
      - name: Run tests
        run: php artisan test --coverage-clover=coverage.xml --min=100

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true
