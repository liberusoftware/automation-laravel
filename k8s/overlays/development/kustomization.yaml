apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

namespace: automation-dev

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: automation-laravel
- patch: |-
    - op: replace
      path: /data/APP_ENV
      value: development
    - op: replace
      path: /data/APP_DEBUG
      value: "true"
    - op: replace
      path: /data/LOG_LEVEL
      value: debug
  target:
    kind: ConfigMap
    name: automation-config

images:
- name: ghcr.io/liberusoftware/automation-laravel
  newTag: develop
