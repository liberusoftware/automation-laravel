apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-redis
  namespace: automation-laravel
  labels:
    app: automation-laravel
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: automation-laravel
      component: redis
  template:
    metadata:
      labels:
        app: automation-laravel
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command: [redis-cli, ping]
          initialDelaySeconds: 5
          periodSeconds: 5
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: automation-redis
  namespace: automation-laravel
  labels:
    app: automation-laravel
    component: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: automation-laravel
    component: redis
