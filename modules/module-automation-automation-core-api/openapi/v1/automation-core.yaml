openapi: 3.1.0
info:
  title: Automation Automation Core API
  version: 1.0.0
  description: Versioned, authenticated API contract for the automation-core module.
servers:
  - url: /
paths:
  /api/v1/automation/automation-core:
    get:
      operationId: automation.automation.core.list
      summary: List authorized automation-core resources.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: automation.automation.core.create
      summary: Create a automation-core resource.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/automation/automation-core/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: automation.automation.core.get
      summary: Retrieve one authorized automation-core resource.
      security:
        - sanctum: []
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: automation.automation.core.update
      summary: Update permitted automation-core fields.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: automation.automation.core.delete
      summary: Delete or deactivate a automation-core resource.
      security:
        - sanctum: []
      responses:
        '204':
          description: Resource deleted successfully.
        '404':
          $ref: '#/components/responses/Problem'
  /api/v1/automation/automation-core/{id}/publish:
    post:
      operationId: automation.automation.core.publish
      summary: Publish a validated workflow version.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [definition]
              properties:
                definition:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/Resource'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/automation/automation-core/{id}/runs:
    post:
      operationId: automation.automation.core.run
      summary: Queue a workflow run with validated variables.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: true
      responses:
        '202':
          $ref: '#/components/responses/Resource'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/automation/automation-core/{id}/runs/{runId}/cancel:
    post:
      operationId: automation.automation.core.cancel-run
      summary: Cancel a queued or running workflow.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '409':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional concurrency validator for updates.
      schema:
        type: string
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    ResourceInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          maxLength: 32
        workflow_definitions:
          type: object
          additionalProperties: true
          description: Module capability payload for workflow_definitions.
        versions:
          type: object
          additionalProperties: true
          description: Module capability payload for versions.
        triggers:
          type: object
          additionalProperties: true
          description: Module capability payload for triggers.
        state:
          type: object
          additionalProperties: true
          description: Module capability payload for state.
        runs:
          type: object
          additionalProperties: true
          description: Module capability payload for runs.
        variables:
          type: object
          additionalProperties: true
          description: Module capability payload for variables.
        schedules:
          type: object
          additionalProperties: true
          description: Module capability payload for schedules.
        retries:
          type: object
          additionalProperties: true
          description: Module capability payload for retries.
        cancellation:
          type: object
          additionalProperties: true
          description: Module capability payload for cancellation.
        compensation:
          type: object
          additionalProperties: true
          description: Module capability payload for compensation.
        idempotency_key:
          type: string
          maxLength: 255
    Resource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: automation-automation-core
        attributes:
          type: object
          additionalProperties: true
    ResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Resource'
    ResourceCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    Resource:
      description: Authorized resource response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceResponse'
    ResourceCollection:
      description: Authorized paginated resource collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    Problem:
      description: RFC 9457 Problem Details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
