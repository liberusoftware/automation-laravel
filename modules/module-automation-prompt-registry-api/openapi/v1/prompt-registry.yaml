openapi: 3.1.0
info:
  title: Automation Prompt Registry API
  version: 1.0.0
  description: Versioned, authenticated API contract for the prompt-registry module.
servers:
  - url: /
paths:
  /api/v1/automation/prompt-registry:
    get:
      operationId: automation.prompt.registry.list
      summary: List authorized prompt-registry resources.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageNumber'
      responses:
        '200':
          $ref: '#/components/responses/ResourceCollection'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
    post:
      operationId: automation.prompt.registry.create
      summary: Create a prompt-registry resource.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '201':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /api/v1/automation/prompt-registry/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      operationId: automation.prompt.registry.get
      summary: Retrieve one authorized prompt-registry resource.
      security:
        - sanctum: []
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: automation.prompt.registry.update
      summary: Update permitted prompt-registry fields.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceInput'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: automation.prompt.registry.delete
      summary: Delete or deactivate a prompt-registry resource.
      security:
        - sanctum: []
      responses:
        '204':
          description: Resource deleted successfully.
        '404':
          $ref: '#/components/responses/Problem'
components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Opaque resource identifier.
      schema:
        type: string
        format: uuid
    PageSize:
      name: page[size]
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageNumber:
      name: page[number]
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: Optional concurrency validator for updates.
      schema:
        type: string
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    ResourceInput:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
        payload:
          type: object
          additionalProperties: true
        status:
          type: string
          maxLength: 32
        versioned_prompts:
          type: object
          additionalProperties: true
          description: Module capability payload for versioned_prompts.
        variables:
          type: object
          additionalProperties: true
          description: Module capability payload for variables.
        evaluation_sets:
          type: object
          additionalProperties: true
          description: Module capability payload for evaluation_sets.
        tenant_overrides:
          type: object
          additionalProperties: true
          description: Module capability payload for tenant_overrides.
        approvals:
          type: object
          additionalProperties: true
          description: Module capability payload for approvals.
        rollback:
          type: object
          additionalProperties: true
          description: Module capability payload for rollback.
        idempotency_key:
          type: string
          maxLength: 255
    Resource:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          const: automation-prompt-registry
        attributes:
          type: object
          additionalProperties: true
    ResourceResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/Resource'
    ResourceCollection:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        links:
          type: object
          additionalProperties: true
        meta:
          type: object
          additionalProperties: true
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    Resource:
      description: Authorized resource response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceResponse'
    ResourceCollection:
      description: Authorized paginated resource collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourceCollection'
    Problem:
      description: RFC 9457 Problem Details response.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
