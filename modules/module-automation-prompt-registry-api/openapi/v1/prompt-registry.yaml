openapi: 3.1.0
info:
  title: prompt-registry API
  version: 1.0.0
paths:
  /api/v1/automation/prompt-registry:
    get:
      operationId: automation.prompt-registry.list
      security: [{ sanctum: [] }]
      responses: { '200': { description: Authorized team-scoped resources } }
    post:
      operationId: automation.prompt-registry.create
      security: [{ sanctum: [] }]
      responses: { '201': { description: Created resource } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }

