openapi: 3.1.0
info:
  title: image API
  version: 1.0.0
paths:
  /api/v1/automation/image:
    get:
      operationId: automation.image.list
      security: [{ sanctum: [] }]
      responses: { '200': { description: Authorized team-scoped resources } }
    post:
      operationId: automation.image.create
      security: [{ sanctum: [] }]
      responses: { '201': { description: Created resource } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }

