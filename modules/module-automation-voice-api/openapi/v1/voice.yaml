openapi: 3.1.0
info:
  title: voice API
  version: 1.0.0
paths:
  /api/v1/automation/voice:
    get:
      operationId: automation.voice.list
      security: [{ sanctum: [] }]
      responses: { '200': { description: Authorized team-scoped resources } }
    post:
      operationId: automation.voice.create
      security: [{ sanctum: [] }]
      responses: { '201': { description: Created resource } }
components:
  securitySchemes:
    sanctum: { type: http, scheme: bearer, bearerFormat: Sanctum }

